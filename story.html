<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Newton’s apple – Phiversity story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--page:#eceff3;--ink:#10151c;--mut:#5b6573;--btn:#10151c;--btnt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#090c10;--ink:#e8edf3;--mut:#8b96a5;--btn:#e8edf3;--btnt:#10151c}}
:root[data-theme="dark"]{--page:#090c10;--ink:#e8edf3;--mut:#8b96a5;--btn:#e8edf3;--btnt:#10151c}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px}
.wrap{container-type:inline-size;position:relative;width:min(100%,calc((100dvh - 130px)*9/16));aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#0b1024}
.wrap canvas{position:absolute;inset:0;display:block}
.hud{position:absolute;inset:0;color:#eaf0f6;pointer-events:none}
.cap{position:absolute;z-index:3;left:7cqw;right:13cqw;bottom:40cqw;font-family:'Instrument Serif',Georgia,serif;font-size:8.2cqw;line-height:1.12;background:rgba(10,14,20,.6);padding:3.2cqw 4cqw;border-radius:3cqw;opacity:0}
.tht{position:absolute;z-index:3;left:9cqw;right:9cqw;top:7.5cqw;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:6.4cqw;line-height:1.22;text-align:center;color:#eaf2fb;text-shadow:0 1px 14px rgba(6,10,16,.85),0 0 26px rgba(88,196,221,.28);opacity:0;pointer-events:none}
#vo{position:absolute;z-index:2;background:#121821;overflow:hidden;opacity:0;border-radius:2cqw;left:0;top:0;width:100%;height:100%;
background-image:linear-gradient(rgba(88,196,221,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(88,196,221,.07) 1px,transparent 1px);background-size:11.1cqw 11.1cqw}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
#lv{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.end{position:absolute;z-index:4;inset:0;background:#121821;display:flex;flex-direction:column;justify-content:center;gap:5cqw;padding:9cqw;opacity:0;
background-image:linear-gradient(rgba(88,196,221,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(88,196,221,.07) 1px,transparent 1px);background-size:11.1cqw 11.1cqw}
.mark{display:flex;align-items:center;gap:3cqw;font-size:8cqw;font-weight:700}
.mark b{display:grid;place-items:center;width:14cqw;height:14cqw;border-radius:50%;border:.7cqw solid #58c4dd;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:10cqw;color:#58c4dd}
.tag{font-family:'Instrument Serif',Georgia,serif;font-size:15cqw;line-height:1;margin:0}
.soon{font-size:5cqw;color:#f4d35e;margin:0}
.bar{position:absolute;z-index:5;left:0;right:0;bottom:0;height:1.1cqw;background:rgba(255,255,255,.1)}
.bar i{display:block;height:100%;background:#58c4dd;transform:scaleX(0);transform-origin:left}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(100%,380px)}
.ctl input[type=range]{flex:1 1 100%;accent-color:#58c4dd}
button{font:inherit;font-weight:500;background:var(--btn);color:var(--btnt);border:0;border-radius:99px;padding:8px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--mut)}
button:focus-visible{outline:2px solid #58c4dd;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hud">
    <div class="cap" id="cap"></div>
    <div class="tht" id="tht"></div>
    <div id="vo"><video id="vid" muted playsinline preload="auto"></video><canvas id="lv"></canvas></div>
    <div class="end" id="end"><div class="mark"><b>φ</b><span>Phiversity</span></div><p class="tag" id="tag">Learn it by watching it.</p><p class="soon" id="soon">Coming soon</p></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
</div>
<div class="ctl">
  <button id="play">Replay</button>
  <button id="add" class="alt">Add Phiversity video</button>
  <button id="snd" class="alt">Sound: off</button>
  <button id="voiceBtn" class="alt">Voice: off</button>
  <input id="scrub" type="range" min="0" max="59.5" step="0.01" value="0" aria-label="Scrub">
  <input id="pick" type="file" accept="video/*" hidden>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const CLIP={src:'',in:0,out:17};
const T=THREE,D=59.5,V0=37.5,V1=54.5;
const sm=(a,b,x)=>{x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x)};
const lr=(a,b,k)=>a+(b-a)*k;
function rng(s){let a=s>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const R=rng(1666),$=id=>document.getElementById(id);

const wrap=$('wrap');
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
wrap.insertBefore(renderer.domElement,wrap.firstChild);
const scene=new T.Scene();scene.fog=new T.Fog(0xe9b077,45,160);
const cam=new T.PerspectiveCamera(42,9/16,.1,420);

// sky
const skyMat=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new T.Color()},bot:{value:new T.Color()}},
 vertexShader:'varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform vec3 top,bot;varying vec3 v;void main(){float h=clamp(normalize(v).y,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.55)),1.);}'});
scene.add(new T.Mesh(new T.SphereGeometry(360,24,16),skyMat));
const SK=[[0,'#6fa3d8','#f2b472'],[11,'#4f6fae','#e98f6a'],[19,'#1f2a55','#6b5a8a'],[27,'#0b1024','#1d2447']].map(r=>[r[0],new T.Color(r[1]),new T.Color(r[2])]);
const cT=new T.Color(),cB=new T.Color();
function skyAt(t){let i=0;while(i<SK.length-2&&t>=SK[i+1][0])i++;const a=SK[i],b=SK[i+1],k=sm(a[0],b[0],t);cT.lerpColors(a[1],b[1],k);cB.lerpColors(a[2],b[2],k)}
let starsMat;{const n=500,p=new Float32Array(n*3);for(let i=0;i<n;i++){const th=R()*6.283,ph=Math.acos(.08+R()*.92),r=330;p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(th)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));
starsMat=new T.PointsMaterial({color:0xffffff,size:1.8,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false});scene.add(new T.Points(g,starsMat))}
const MOON=new T.Vector3(-8,30,-60);
{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');x.fillStyle='#e6eaf1';x.fillRect(0,0,256,256);
const r2=rng(7);for(let i=0;i<34;i++){x.fillStyle='rgba(120,130,150,'+(.12+r2()*.18)+')';x.beginPath();x.arc(r2()*256,r2()*256,6+r2()*22,0,6.283);x.fill()}
const m=new T.Mesh(new T.SphereGeometry(3.2,32,24),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),fog:false}));m.position.copy(MOON);scene.add(m)}

// lights
const sun=new T.DirectionalLight(0xffd29a,1.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:120});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
const hemi=new T.HemisphereLight(0x9fc4ee,0x2a3320,.6);scene.add(hemi);
const moonL=new T.DirectionalLight(0x9bb2ff,0);moonL.position.copy(MOON);scene.add(moonL);
const lamp=new T.PointLight(0xffa95a,0,9);lamp.position.set(4.1,1.05,0.05);scene.add(lamp);

// terrain
const H=(x,z)=>{const r=Math.hypot(x,z),b=.5*Math.sin(x*.09)*Math.cos(z*.08)+.3*Math.sin(x*.21+z*.17);return b*sm(6,16,r)+6*sm(45,75,r)*(.5+.5*Math.sin(x*.05+z*.07))};
{const g=new T.PlaneGeometry(150,150,70,70);g.rotateX(-Math.PI/2);const p=g.attributes.position,col=new Float32Array(p.count*3),c=new T.Color();
for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),h=H(x,z);p.setY(i,h);const n=.5+.5*Math.sin(x*.7)*Math.cos(z*.6);c.setHSL(.25+.03*n,.45,.24+.08*n-Math.min(.08,h*.02));col.set([c.r,c.g,c.b],i*3)}
g.setAttribute('color',new T.BufferAttribute(col,3));g.computeVertexNormals();
const gr=new T.Mesh(g,new T.MeshLambertMaterial({vertexColors:true}));gr.receiveShadow=true;scene.add(gr)}
{const n=1600,im=new T.InstancedMesh(new T.ConeGeometry(.05,.38,4),new T.MeshLambertMaterial({color:0x7aa84c}),n),o=new T.Object3D();
for(let i=0;i<n;i++){const a=R()*6.283,r=1.5+Math.sqrt(R())*26,x=Math.cos(a)*r,z=Math.sin(a)*r;o.position.set(x,H(x,z)+.17,z);o.rotation.set((R()-.5)*.4,0,(R()-.5)*.4);o.scale.setScalar(.6+R()*1.1);o.updateMatrix();im.setMatrixAt(i,o.matrix)}scene.add(im)}
{const n=90,im=new T.InstancedMesh(new T.ConeGeometry(0.02,0.07,5),new T.MeshLambertMaterial({color:0xffffff}),n),o=new T.Object3D(),cc=new T.Color(),cols=[0xeeeeee,0xf4d35e,0xd98fb0,0xffffff];
for(let i=0;i<n;i++){const a=R()*6.283,r=2+Math.sqrt(R())*22,x=Math.cos(a)*r,z=Math.sin(a)*r;o.position.set(x,H(x,z)+0.05,z);o.rotation.set((R()-0.5)*0.5,R()*6.28,(R()-0.5)*0.5);o.scale.setScalar(0.7+R()*0.8);o.updateMatrix();im.setMatrixAt(i,o.matrix);im.setColorAt(i,cc.set(cols[Math.floor(R()*cols.length)]))}
im.instanceColor.needsUpdate=true;scene.add(im)}
{const n=50,im=new T.InstancedMesh(new T.SphereGeometry(0.07,6,5),new T.MeshLambertMaterial({color:0x8d8d88,flatShading:true}),n),o=new T.Object3D();
for(let i=0;i<n;i++){const a=R()*6.283,r=2.5+R()*14,x=Math.cos(a)*r,z=Math.sin(a)*r;o.position.set(x,H(x,z)+0.04,z);o.rotation.y=R()*6.28;o.scale.set(0.6+R()*0.9,0.4+R()*0.3,0.6+R()*0.9);o.updateMatrix();im.setMatrixAt(i,o.matrix)}
scene.add(im)}

// ============================================================
//  DETAILED APPLE TREE  (safe, guarded recursive builder)
// ============================================================
// Bark texture
const barkCanvas=document.createElement('canvas');barkCanvas.width=256;barkCanvas.height=512;
{const x=barkCanvas.getContext('2d'),rb=rng(42);
 const g=x.createLinearGradient(0,0,256,0);g.addColorStop(0,'#3d2a1c');g.addColorStop(.5,'#5a4130');g.addColorStop(1,'#3d2a1c');
 x.fillStyle=g;x.fillRect(0,0,256,512);
 for(let i=0;i<340;i++){const px=rb()*256,py=rb()*512,h=20+rb()*90;
  x.strokeStyle='rgba('+(rb()<.5?'20,12,6':'110,80,52')+','+(.15+rb()*.35)+')';
  x.lineWidth=1+rb()*3;x.beginPath();x.moveTo(px,py);x.bezierCurveTo(px+(rb()-.5)*12,py+h*.3,px+(rb()-.5)*12,py+h*.6,px+(rb()-.5)*6,py+h);x.stroke()}
 for(let i=0;i<120;i++){x.fillStyle='rgba(140,110,80,'+(.08+rb()*.18)+')';x.beginPath();x.arc(rb()*256,rb()*512,1+rb()*3,0,6.283);x.fill()}
}
const barkTex=new T.CanvasTexture(barkCanvas);barkTex.wrapS=barkTex.wrapT=T.RepeatWrapping;barkTex.repeat.set(2,3);
const barkM=new T.MeshLambertMaterial({map:barkTex});

// Leaf material variants
const leafM=[];
for(let i=0;i<8;i++){ leafM.push(new T.MeshLambertMaterial({color:new T.Color().setHSL(.24+i*.008,.42+(i%3)*.05,.16+i*.018),flatShading:true})); }
// Apple materials
const appleMats=[
  new T.MeshLambertMaterial({color:0xc0392b}),
  new T.MeshLambertMaterial({color:0xa93226}),
  new T.MeshLambertMaterial({color:0xd94f3d}),
  new T.MeshLambertMaterial({color:0x8ab04a}),
  new T.MeshLambertMaterial({color:0xe8a33d}),
];
const stemM=new T.MeshLambertMaterial({color:0x5a3d24});
const appleLeafM=new T.MeshLambertMaterial({color:0x4f7a2c,flatShading:true});

// Detailed apple builder: body + stem + leaf + highlight
function mkApple(r,mat){
 const g=new T.Group();
 const b=new T.Mesh(new T.SphereGeometry(r,14,11),mat);b.scale.y=0.92;b.castShadow=true;b.receiveShadow=true;g.add(b);
 const st=new T.Mesh(new T.CylinderGeometry(r*0.05,r*0.07,r*0.5,5),stemM);st.position.y=r*1.05;g.add(st);
 const lf=new T.Mesh(new T.ConeGeometry(r*0.26,r*0.6,5),appleLeafM);lf.position.set(r*0.3,r*1.25,0);lf.rotation.z=-0.65;g.add(lf);
 const hi=new T.Mesh(new T.SphereGeometry(r*0.34,8,6),new T.MeshBasicMaterial({color:0xffb0a0,transparent:true,opacity:0.3}));hi.position.set(-r*0.38,r*0.3,r*0.55);g.add(hi);
 return g}
const mossM=new T.MeshLambertMaterial({color:0x2e4a1e,flatShading:true});

const sway=[];
const canopySpots=[];

// Safe recursive branch: builds children in local coords of parent
function buildBranch(parent, startVec, dirVec, length, radius, depth, rnd){
  if(depth<0 || length<0.05 || radius<0.01) return;
  const dir=dirVec.clone().normalize();
  const end=startVec.clone().addScaledVector(dir,length);
  const geo=new T.CylinderGeometry(Math.max(radius*0.6,0.01),Math.max(radius,0.02),length,7,1);
  const m=new T.Mesh(geo,barkM);m.castShadow=true;m.receiveShadow=true;
  m.position.copy(startVec).addScaledVector(dir,length/2);
  m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),dir);
  parent.add(m);

  if(depth===0) return;

  const kids=2+Math.floor(rnd()*2);
  for(let i=0;i<kids;i++){
    const spread=0.5+rnd()*0.6;
    const nd=dir.clone().add(new T.Vector3((rnd()-0.5)*spread, 0.2+rnd()*0.4, (rnd()-0.5)*spread)).normalize();
    buildBranch(parent, end, nd, length*(0.62+rnd()*0.15), radius*0.62, depth-1, rnd);
  }
}

// Foliage cluster
function foliageCluster(parent, pos, scale, rnd, nMin=5){
  const grp=new T.Group();grp.position.copy(pos);parent.add(grp);
  canopySpots.push(grp);
  const n=nMin+Math.floor(rnd()*4);
  for(let i=0;i<n;i++){
    const s=scale*(0.7+rnd()*0.6);
    const m=new T.Mesh(new T.IcosahedronGeometry(s,1),leafM[Math.floor(rnd()*leafM.length)]);
    m.position.set((rnd()-0.5)*scale*1.7,(rnd()-0.4)*scale*1.1,(rnd()-0.5)*scale*1.7);
    m.rotation.set(rnd()*6.28,rnd()*6.28,rnd()*6.28);
    m.castShadow=true;m.receiveShadow=true;grp.add(m);
  }
  const na=Math.floor(rnd()*4);
  for(let i=0;i<na;i++){
    const a=mkApple(0.09+rnd()*0.03,appleMats[Math.floor(rnd()*appleMats.length)]);
    a.position.set((rnd()-0.5)*scale*1.5,(rnd()-0.7)*scale*0.9,(rnd()-0.5)*scale*1.5);grp.add(a);
  }
}

// Build the hero tree
const treeRoot=new T.Group();treeRoot.position.set(0,H(0,0),0);scene.add(treeRoot);
{
  const rnd=rng(2024);
  // trunk base flare + main stem
  const flare=new T.Mesh(new T.CylinderGeometry(0.42,0.62,1.1,9),barkM);
  flare.position.y=0.55;flare.castShadow=true;flare.receiveShadow=true;treeRoot.add(flare);
  const trunk=new T.Mesh(new T.CylinderGeometry(0.28,0.42,3.2,9),barkM);
  trunk.position.y=2.3;trunk.castShadow=true;trunk.receiveShadow=true;treeRoot.add(trunk);

  // surface roots
  for(let i=0;i<8;i++){
    const a=i/8*6.283+rnd()*0.5;
    const root=new T.Mesh(new T.CylinderGeometry(0.05,0.12,0.7+rnd()*0.6,6),barkM);
    root.position.set(Math.cos(a)*0.55,0.25,Math.sin(a)*0.55);
    root.rotation.z=Math.PI/2-0.3;root.rotation.y=-a;root.castShadow=true;treeRoot.add(root);
  }

  // main limbs + central leader
  const topY=3.9;
  for(let i=0;i<6;i++){
    const a=i/6*6.283+rnd()*0.4;
    const dir=new T.Vector3(Math.cos(a)*0.7,0.9+rnd()*0.3,Math.sin(a)*0.7).normalize();
    buildBranch(treeRoot,new T.Vector3(0,topY,0),dir,1.7+rnd()*0.5,0.16,2,rnd);
  }
  buildBranch(treeRoot,new T.Vector3(0,topY,0),new T.Vector3(0.05,1,0.03).normalize(),2.2,0.18,2,rnd);

  // crown foliage
  const crownY=topY+1.4;
  for(let i=0;i<9;i++){
    const a=i/9*6.283+rnd()*0.5,r=1.4+rnd()*1.8;
    foliageCluster(treeRoot,new T.Vector3(Math.cos(a)*r,crownY+(rnd()-0.3)*1.6,Math.sin(a)*r),0.95+rnd()*0.4,rnd);
  }
  foliageCluster(treeRoot,new T.Vector3(0,crownY+1.6,0),1.1,rnd);

  // apple-dropping branch toward (AX,~4.6,AZ) relative to treeRoot at origin
  const bStart=new T.Vector3(0.3,3.4,0);
  const bEnd=new T.Vector3(3.6,4.6,-1.5);
  const bDir=bEnd.clone().sub(bStart);
  buildBranch(treeRoot,bStart,bDir,bDir.length(),0.13,1,rnd);
  // foliage around the apple branch
  foliageCluster(treeRoot,new T.Vector3(3.2,4.9,-1.0),0.95,rnd);
  foliageCluster(treeRoot,new T.Vector3(2.4,4.6,-0.7),0.85,rnd);
  foliageCluster(treeRoot,new T.Vector3(4.0,4.8,-1.5),0.8,rnd);

  // instanced leaf quads through the crown
  {const n=550,g=new T.PlaneGeometry(0.13,0.19),m=new T.MeshLambertMaterial({color:0xffffff,side:T.DoubleSide});
   const im=new T.InstancedMesh(g,m,n),o=new T.Object3D(),cc=new T.Color();
   for(let i=0;i<n;i++){const app=i>410,a=R()*6.283,r=Math.sqrt(R())*(app?1.5:2.7),y=(app?4.2+R()*1.5:4.3+R()*2.6);
    o.position.set((app?3.0:0)+Math.cos(a)*r,y,(app?-1.0:0)+Math.sin(a)*r);
    o.rotation.set(R()*6.28,R()*6.28,R()*6.28);o.updateMatrix();im.setMatrixAt(i,o.matrix);
    im.setColorAt(i,cc.setHSL(0.22+R()*0.07,0.5,0.2+R()*0.16))}
   im.instanceColor.needsUpdate=true;treeRoot.add(im)}
  // moss patches on bark
  for(let i=0;i<5;i++){const a=R()*6.283,y=0.3+R()*2.6,r=(y<1.1?0.5+R()*0.15:0.3+R()*0.12);
   const m=new T.Mesh(new T.SphereGeometry(0.08+R()*0.09,8,6),mossM);m.scale.y=0.45;
   m.position.set(Math.cos(a)*r,y,Math.sin(a)*r);treeRoot.add(m)}
}

// Hero apple (the one that falls)
const AX=3.6,AZ=-1.4,Y0=4.5,GR=0.12;
const appleGrp=new T.Group();scene.add(appleGrp);
appleGrp.add(mkApple(0.13,appleMats[0]));

// Decorative hanging apples
for(const p of [[-1.1,5.2,0.8],[0.2,5.8,-1],[-0.6,4.9,-1.2],[1.4,5.5,-0.4],[2.6,4.5,-0.9],[3.0,4.4,-1.2],[-1.8,4.6,0.3]]){
  const a=mkApple(0.11,appleMats[Math.floor(R()*appleMats.length)]);a.position.set(p[0],p[1],p[2]);scene.add(a);
}

let voiceRetryTimer=null, voiceRetries=0, lastUt=null;
function pickVoiceFromList(vs){
  if(!vs||!vs.length) return null;
  const prefs=[
    v=>v.lang==='en-GB' && !/Google/i.test(v.name),
    v=>/Daniel|Arthur|Serena|Hazel|George|Ryan/i.test(v.name),
    v=>v.lang==='en-GB',
    v=>/^en/.test(v.lang) && !/Google/i.test(v.name),
    v=>/^en/.test(v.lang),
    v=>true
  ];
  for(const p of prefs){ const v=vs.find(p); if(v) return v; }
  return vs[0];
}
function initVoices(){
  if(!synth) return;
  const vs=synth.getVoices();
  if(vs && vs.length){
    chosenVoice=pickVoiceFromList(vs);
    voiceReady=true;
    if(voiceRetryTimer){clearInterval(voiceRetryTimer);voiceRetryTimer=null}
  }
}

  synth.addEventListener?.('voiceschanged', initVoices);
  synth.onvoiceschanged = initVoices;

}
function speak(text){
  if(!voiceOn || !synth) return;
  if(!voiceReady){
    if(voiceRetries<25){ voiceRetries++; setTimeout(()=>speak(text),120); }
    else{ voiceReady=true; console.warn('No TTS voices found — trying default voice'); speak(text); }
    return;
  }
  try{ synth.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  if(chosenVoice) u.voice=chosenVoice;
  u.lang=(chosenVoice&&chosenVoice.lang)||'en-GB';
  u.rate=0.92; u.pitch=0.88; u.volume=1;
  u.onerror=e=>console.warn('TTS error:',e&&e.error||e);
  lastUt=u;
  try{ if(synth.paused) synth.resume(); }catch(e){}
  setTimeout(()=>{ if(voiceOn&&lastUt===u){ try{synth.speak(u)}catch(e){} } },40);
}

$('play').onclick=()=>{

  initVoices();
  playing=true; spokenIdx=-1; cancelSpeech();

};

$('voiceBtn').onclick=()=>{
  voiceOn=!voiceOn;
  $('voiceBtn').textContent='Voice: '+(voiceOn?'on':'off');
  if(voiceOn){
    try{ if(synth){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; synth.speak(u); } }catch(e){}
