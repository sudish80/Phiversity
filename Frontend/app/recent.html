<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Recent · Phiversity</title><link rel="stylesheet" href="../assets/style.css"></head><body><div class="shell"><main><h1>Recent</h1><div id="list" class="grid"></div><p class="msg" id="empty" hidden>Nothing to show yet.</p><p style="margin-top:16px"><a class="btn" href="../chat.html">Back to chat</a></p></main>
<script src="../assets/app.js"></script>
<script>
(async()=>{
  const box=document.getElementById('list'),empty=document.getElementById('empty');
  const data=await lf.get('/api/lectures');
  const lectures=(data.lectures||[]).slice(0,9);
  if(!lectures.length){empty.hidden=false;return}
  for(const lec of lectures){
    const card=lf.el('div',{class:'card'},[
      lf.el('strong',{text:lec.title}),
      lec.question?lf.el('p',{style:'font-size:.85rem',text:lec.question}):null,
      lf.el('div',{class:'pbox'}),
      lf.el('p',{style:'font-size:.75rem;color:#858fa0',text:lf.date(lec.modified)+' · '+lec.segments+' segments · '+lf.fmt(lec.narration_seconds)})
    ].filter(Boolean));
    box.appendChild(card);
    lfPlayer(card.querySelector('.pbox'),{src:lec.video,preload:'none'});
  }
})();
</script></div><script src="../assets/app.js"></script></body></html>
