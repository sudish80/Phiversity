<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Phiversity Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/player.css">
<style>
/* Layout: chat on the left, an animation panel opens on the right (full screen on phones).
   Black and white brand, one committed dark look. */
:root{--bg:#000;--surface:#0b0b0b;--el:#121212;--el2:#1a1a1a;--line:#2a2a2a;--fg:#fff;--text:#d4d4d4;--mute:#a3a3a3;--dim:#8a8a8a;
--display:'Space Grotesk',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#app{height:100%;display:flex;min-height:0}
.chat{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;min-height:0}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.logo{font:700 1.2rem var(--display);color:var(--fg);display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.logo i{font-style:normal}
.ibtn{flex:none;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:none;color:var(--fg);cursor:pointer}
.ibtn:hover{background:var(--el2);border-color:#555}
.ibtn svg{display:block}
#thread{flex:1;min-height:0;overflow-y:auto;padding:20px 16px 8px}
.col{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.msg.user{align-self:flex-end;max-width:88%;background:var(--el2);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 14px;color:var(--fg);overflow-wrap:anywhere}
.msg.user img{display:block;max-width:min(240px,100%);border-radius:10px;margin-bottom:8px}
.msg.bot{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px}
.av{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:700 14px var(--display);color:var(--fg)}
.body{min-width:0;display:flex;flex-direction:column;gap:14px}
.body p{margin:0;color:var(--text);overflow-wrap:anywhere}
.vcard{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.vcard:hover{border-color:#555;background:var(--el)}
.vcard.on{border-color:var(--fg)}
.vcard .vic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--el2);display:grid;place-items:center;color:var(--fg)}
.vcard .vtx{min-width:0;display:flex;flex-direction:column}
.vcard b{font:600 14px var(--body);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard small{font-size:12px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.chip:hover{background:var(--el2);color:var(--fg);border-color:#555}
.welcome{padding-block:8vh 0;display:flex;flex-direction:column;gap:18px}
.welcome h1{margin:0;font:700 clamp(1.8rem,5vw,2.8rem)/1.1 var(--display);color:var(--fg);letter-spacing:-.02em;text-wrap:balance}
.welcome p{margin:0;color:var(--mute);max-width:52ch}
#composer{flex:none;padding:8px 16px 14px}
.box{max-width:720px;margin:0 auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.box:focus-within{border-color:#777}
#q{width:100%;resize:none;border:0;background:transparent;color:var(--fg);outline:none;max-height:160px;min-height:28px;line-height:1.5}
#q::placeholder{color:var(--dim)}
#attached[hidden]{display:none!important}
.att{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px;color:var(--text);max-width:100%}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.att button{border:0;background:none;cursor:pointer;color:var(--mute);padding:2px 6px;font-size:14px}
.tools{display:flex;align-items:center;gap:8px}
.tools .grow{flex:1}
.send{background:var(--fg);color:#000;border:0;border-radius:10px;padding:8px 18px;font-weight:600;cursor:pointer}
.send:hover{background:#ddd}
.sr{position:absolute;left:-9999px}

/* animation panel */
#panel{flex:none;width:min(52%,640px);display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--surface)}
.phead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font:600 1rem var(--display);color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
@media(max-width:860px){#app{flex-direction:column}#panel{order:-1;width:auto;max-height:54%;border-left:0;border-bottom:1px solid var(--line)}.phead{padding:8px 12px}.pbody{padding:12px;gap:10px}.welcome{padding-block:3vh 0}}
@media(max-width:480px){.msg.bot{grid-template-columns:minmax(0,1fr)}.av{display:none}}
/* recent-chats drawer */
#dbk{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(320px,85vw);background:var(--surface);border-right:1px solid var(--line);z-index:50;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .25s ease}
#drawer.open{transform:none}
.dhead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font:600 1rem var(--display);color:var(--fg)}
#dlist{flex:1;overflow-y:auto;padding:8px}
.ditem{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);margin-bottom:4px}
.ditem:hover{background:var(--el);border-color:var(--line)}
.ditem b{display:block;font:600 13px var(--body);color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem small{font-size:11px;color:var(--mute)}
.ditem .ddel{float:right;border:1px solid var(--line);border-radius:7px;background:none;color:var(--mute);cursor:pointer;font-size:11px;padding:2px 7px;margin-left:8px}
.ditem .ddel:hover{color:#ff9aa2;border-color:#ff9aa2}

/* video mode: phi-player inside the animation panel */
#pvid{width:100%}
#pvid .phi-player{width:100%;max-width:100%;border:0;border-radius:12px}
.vcard.busy .vic{color:var(--mute)}
.vcard.busy b{color:var(--text)}
</style>

<div id="dbk" hidden></div>
<div id="drawer" aria-label="Recent chats">
  <div class="dhead"><span>Recent chats</span><button type="button" class="ibtn" id="dclose" aria-label="Close">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button></div>
  <div id="dlist"></div>
</div>
<div id="app">
  <div class="chat">
    <header>
      <span class="logo"> Phiversity</span>
      <span style="display:flex;gap:8px">
        <button type="button" class="ibtn" id="hist" aria-label="Recent chats" title="Recent chats">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </button>
        <a class="ibtn" href="app/create/settings.html" aria-label="Generation settings" title="Generation settings" style="display:grid;text-decoration:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <button type="button" class="ibtn" id="new" aria-label="New chat" title="New chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M18.5 3.5a2.1 2.1 0 0 1 3 3L12 16l-4 1 1-4z"/></svg>
        </button>
      </span>
    </header>
    <div id="thread" role="log" aria-live="polite" aria-label="Conversation"><div id="col" class="col"></div></div>
    <form id="composer" autocomplete="off">
      <div class="box">
        <div id="attached" hidden></div>
        <label for="q" class="sr">Your question</label>
        <textarea id="q" rows="1" placeholder="Ask a question, or ask a follow-up" maxlength="1000"></textarea>
        <div class="tools">
          <input type="file" id="file" accept="image/*" hidden>
          <button type="button" class="ibtn" id="attach" aria-label="Add image" title="Add image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          </button>
          <span class="grow"></span>
          <button type="submit" class="send">Send</button>
        </div>
      </div>
    </form>
  </div>

  <aside id="panel" hidden aria-label="Animation viewer">
    <div class="phead">
      <h2 id="ptitle"></h2>
      <button type="button" class="ibtn" id="pclose" aria-label="Close animation" title="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="pbody">
      <div id="pvid" hidden></div>
      <div id="pmon" hidden>
        <div style="aspect-ratio:16/9;background:#000;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
          <div id="pmpct" style="font:700 2.4rem var(--display);color:var(--fg)">0%</div>
          <div style="width:70%"><div style="height:6px;background:#1a1a1a;border-radius:6px;overflow:hidden"><div id="pmbar" style="height:6px;width:0%;background:#fff;transition:width .4s"></div></div></div>
          <div id="pmstage" style="font:13px var(--mono);color:var(--mute)">queued</div>
        </div>
        <p id="pmnote" style="font-size:.78rem;color:var(--dim);margin:8px 0 0">Rendering your lecture — the video appears here the moment it is ready. <a id="pmfull" href="#" style="color:var(--mute)">Open the full progress page</a></p>
        <pre id="pmlog" style="font:11px var(--mono);color:var(--mute);background:#0d0d0d;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:110px;overflow:auto;margin:8px 0 0"></pre>
      </div>
    </div>
  </aside>
</div>

<script src="assets/app.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var thread=$('#thread'),col=$('#col'),form=$('#composer'),input=$('#q'),fileIn=$('#file'),attachBtn=$('#attach'),attBox=$('#attached'),newBtn=$('#new');
var panel=$('#panel'),ptitle=$('#ptitle'),pclose=$('#pclose'),pvid=$('#pvid');
var attached=null;
var PLAY='<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
/* ---------- side panel: render progress, then the finished video ---------- */
var pmon=document.getElementById('pmon'),pmpct=document.getElementById('pmpct'),
    pmbar=document.getElementById('pmbar'),pmstage=document.getElementById('pmstage'),
    pmlog=document.getElementById('pmlog'),pmfull=document.getElementById('pmfull');
var stopWatch=null,monId=null;
function stopMonitor(clearPanel){
  if(stopWatch){stopWatch();stopWatch=null}
  monId=null;
  if(clearPanel)pmon.hidden=true;
}
function openMonitor(id,title){
  stopMonitor(false);
  panel.hidden=false;ptitle.textContent=title||'Rendering lecture';
  pvid.hidden=true;pvid.innerHTML='';
  pmon.hidden=false;
  pmfull.href='app/generate/item.html?id='+id;
  pmlog.textContent='';pmpct.textContent='0%';pmbar.style.width='0%';pmstage.textContent='queued';
  monId=id;
  stopWatch=lf.watchJob(id,function(j){
    if(monId!==id)return false;
    pmpct.textContent=j.progress+'%';
    pmbar.style.width=j.progress+'%';
    pmstage.textContent=j.status==='queued'?'queued':(j.stage+(j.topic?' \u00B7 '+j.topic:''));
    pmlog.textContent=(j.logs||[]).slice(-8).join('\n');
    pmlog.scrollTop=pmlog.scrollHeight;
    if(j.status==='done'){stopMonitor(true);openVideo(j.video,j.title||title)}
    else if(j.status==='error'){
      pmpct.textContent='failed';pmbar.style.width='0%';
      pmstage.textContent=j.error||'render failed';
    }
  },function(){stopMonitor(true)});
}
function openVideo(url,title){
  stopMonitor(true);
  panel.hidden=false;ptitle.textContent=title||'Lecture video';
  pvid.hidden=false;pvid.innerHTML='';
  lfPlayer(pvid,{src:url,preload:'metadata'});
}
function closePanel(){panel.hidden=true;stopMonitor(true);pvid.hidden=true;pvid.innerHTML=''}
pclose.onclick=closePanel;
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!panel.hidden)closePanel()});

/* ---------- transcript persistence (chat survives reloads) ----------
   Videos are NOT stored in the thread - they live in the library and
   stream by URL; the thread saves messages, canned params, and job ids. */
var TRANSCRIPT=[],RESTORING=false,saveTimer=null,
    CHAT_ID=new URLSearchParams(location.search).get('chat'),
    CHAT_TITLE='';
function pushMsg(m){if(RESTORING)return;TRANSCRIPT.push(m);saveChat()}
function patchMsg(pred,fields){
  var m=TRANSCRIPT.find(pred);if(!m||RESTORING)return;
  Object.assign(m,fields);saveChat();
}
function chatTitle(){
  if(CHAT_TITLE)return CHAT_TITLE;
  var first=TRANSCRIPT.find(function(m){return m.role==='user'&&m.text});
  return first?first.text.slice(0,80):'Untitled chat';
}
function saveChat(){
  if(!SERVICE.ready||RESTORING||!TRANSCRIPT.length)return;
  if(!CHAT_ID){
    CHAT_ID='';
    for(var i=0;i<12;i++)CHAT_ID+=Math.floor(Math.random()*16).toString(16);
    history.replaceState(null,'','chat.html?chat='+CHAT_ID);
  }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    fetch('/api/chats/'+CHAT_ID,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:chatTitle(),messages:TRANSCRIPT})
    }).catch(function(){});
  },400);
}
function restoreThread(messages,chatId,title){
  CHAT_ID=chatId||CHAT_ID;CHAT_TITLE=title||'';
  RESTORING=true;
  messages.forEach(function(m){
    if(m.role==='user'){addUser(m.text,null)}
    else if(m.kind==='job'){
      restoreJobCard(m);
    }
  });
  RESTORING=false;
  if(!col.children.length)return false;
  return true;
}

/* ---------- the generation service ---------- */
var SERVICE={ready:false,llm:false,topics:[]};
var STARTERS=['Show how a ball thrown at 20 m/s and 45\u00B0 lands and find its range','Explain simple harmonic motion of a mass on a spring','Draw f(x) = x\u00B2 and show the tangent line','Show how the price changes when demand rises'];
function serviceChips(){
  if(!SERVICE.ready)return [];
  if(SERVICE.llm)return STARTERS;
  return SERVICE.topics.map(function(t){return {label:t.title,topic:t.topic}});
}
function lastDoneJob(){
  for(var i=TRANSCRIPT.length-1;i>=0;i--){
    var m=TRANSCRIPT[i];
    if(m.kind==='job'&&m.status==='done'&&m.id)return m.id;
  }
  return null;
}
function serviceReply(text,topic,img){
  var followOf=topic?null:lastDoneJob();
  var o=jobCardShell(topic
    ?('Generating the sample lecture \u201C'+topic+'\u201D \u2014 this takes a minute or two.')
    :(followOf
      ?('Adding this as a follow-up \u2014 I am extending your existing lecture with new narrated scenes.')
      :('Generating a narrated video lecture for your question \u2014 this takes a couple of minutes.')));
  if(img)o.p.textContent='Images are not read by the local service yet, so I used your typed question. '+o.p.textContent;
  var id=null;
  o.card.onclick=function(){if(id)openMonitor(id,topic?('\u201C'+topic+'\u201D'):'Your lecture')};
  var body=topic?{topic:topic}:{question:text};
  if(followOf)body.follow_up_of=followOf;
  lf.post('/api/generate',body).then(function(r){
    id=r.id;
    pushMsg({role:'bot',kind:'job',id:id,text:o.p.textContent,topic:topic||null});
    trackJob(id,o);
  }).catch(function(err){failCard(o,'Could not start the job: '+err.message)});
}
function jobCardShell(text){
  var el=document.createElement('div');el.className='msg bot';
  el.innerHTML='<div class="av" aria-hidden="true"></div><div class="body"><p></p><button type="button" class="vcard busy"><span class="vic">'+PLAY+'</span><span class="vtx"><b>Preparing job\u2026</b><small>queued</small></span></button><div class="extra"></div></div>';
  col.appendChild(el);
  var p=el.querySelector('p');p.textContent=text;
  return {el:el,p:el.querySelector('p'),card:el.querySelector('.vcard'),
          b:el.querySelector('b'),small:el.querySelector('small'),
          extra:el.querySelector('.extra')};
}
function finishCard(o,j){
  o.card.classList.remove('busy');o.card.classList.add('on');
  o.b.textContent=j.title||j.topic||'Your lecture';
  o.small.textContent='Video ready \u00B7 click to replay';
  o.card.onclick=function(){openVideo(j.video,j.title)};
}
function failCard(o,message){
  o.card.remove();
  var e=document.createElement('p');e.style.color='#ff9aa2';e.textContent=message;
  o.extra.appendChild(e);o.extra.appendChild(chipRow(serviceChips()));
}
function restoreJobCard(m){
  var o=jobCardShell(m.text||'Generating a narrated video lecture.');
  var interrupted='This render was interrupted by a server restart and its video is no longer available.';
  lf.get('/api/jobs/'+m.id).then(function(j){
    if(j.status==='done'&&j.video){finishCard(o,j);if(m.autoplay)openVideo(j.video,j.title)}
    else if(j.status==='error'){failCard(o,j.error)}
    else{o.b.textContent=j.title||j.topic||'Your lecture';
      o.card.onclick=function(){openMonitor(m.id,o.b.textContent)};
      trackJob(m.id,o)}
  }).catch(function(){
    if(m.video){
      fetch(m.video,{headers:{Range:'bytes=0-1'}}).then(function(r){
        if(r.ok||r.status===206)finishCard(o,{video:m.video,title:m.title});
        else failCard(o,interrupted);
      }).catch(function(){failCard(o,interrupted)});
    }else failCard(o,interrupted);
  });
}
function trackJob(id,o){
  lf.watchJob(id,function(j){
    if(!o.card.isConnected)return false;
    if(j.title)o.b.textContent=j.title;else if(j.topic)o.b.textContent=j.topic;
    if(j.status==='done'){
      finishCard(o,j);
      patchMsg(function(m){return m.kind==='job'&&m.id===id},
               {status:'done',video:j.video,title:j.title});
      openVideo(j.video,j.title);
    }else if(j.status==='error'){
      failCard(o,j.error);
      patchMsg(function(m){return m.kind==='job'&&m.id===id},{status:'error'});
    }else{
      o.small.textContent=j.stage+' \u00B7 '+j.progress+'%';
    }
  });
}

/* ---------- recent chats drawer ---------- */
var drawer=document.getElementById('drawer'),dbk=document.getElementById('dbk'),
    dlist=document.getElementById('dlist'),dclose=document.getElementById('dclose');
function chatRow(chat,onDelete){
  var b=document.createElement('button');b.type='button';b.className='ditem';
  var inner=document.createElement('b');inner.textContent=chat.title;
  var del=document.createElement('button');del.type='button';del.className='ddel';
  del.textContent='\u2715';del.setAttribute('aria-label','Delete chat');
  del.onclick=function(e){e.stopPropagation();onDelete(chat)};
  b.appendChild(inner);b.appendChild(del);
  var meta=document.createElement('small');
  meta.textContent=chat.messages+' messages \u00B7 '+
    (chat.videos?chat.videos.length:0)+' video'+
    ((chat.videos&&chat.videos.length===1)?'':'s')+' \u00B7 '+
    Math.round((chat.ago||0)/60)+' min ago';
  b.appendChild(meta);
  return b;
}
function closeDrawer(){drawer.classList.remove('open');dbk.hidden=true}
function openDrawer(){
  if(!SERVICE.ready){alert('Recent chats need the local service (phiversity-serve).');return}
  drawer.classList.add('open');dbk.hidden=false;
  lf.get('/api/chats').then(function(d){
    dlist.innerHTML='';
    var chats=d.chats||[];
    if(!chats.length){
      var e=document.createElement('p');e.style.cssText='color:var(--mute);font-size:13px;padding:12px';
      e.textContent='No saved chats yet.';dlist.appendChild(e);return;
    }
    chats.forEach(function(chat){
      dlist.appendChild(chatRow(chat,function(c){
        if(!confirm('Delete this chat?'))return;
        fetch('/api/chats/'+c.id,{method:'DELETE'}).then(openDrawer);
      })).onclick=function(){
        if(CHAT_ID===chat.id){closeDrawer();return}
        location.href='chat.html?chat='+chat.id;
      };
    });
  }).catch(function(err){alert('Could not load chats: '+err.message)});
}
document.getElementById('hist').onclick=openDrawer;
dclose.onclick=closeDrawer;dbk.onclick=closeDrawer;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&drawer.classList.contains('open'))closeDrawer()});

/* ---------- messages ---------- */
function scrollEnd(){thread.scrollTo({top:thread.scrollHeight,behavior:reduce?'auto':'smooth'})}
function clearWelcome(){var w=col.querySelector('.welcome');if(w)w.remove();}
function chipRow(list){
  var d=document.createElement('div');d.className='chips';
  list.forEach(function(s){
    var o=(typeof s==='string')?{label:s,text:s}:s;
    var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=o.label;
    b.onclick=function(){send(o.topic?null:o.text,o.topic)};d.appendChild(b)});
  return d;
}
function addUser(text,img){
  var el=document.createElement('div');el.className='msg user';
  if(img){var im=document.createElement('img');im.src=img.url;im.alt='Image you attached';el.appendChild(im)}
  if(text){var s=document.createElement('span');s.textContent=text;el.appendChild(s)}
  col.appendChild(el);
  pushMsg({role:'user',text:text,img:img?img.name:null});
}
function showWelcome(){
  var w=document.createElement('div');w.className='welcome';
  if(SERVICE.ready&&SERVICE.llm){
    w.innerHTML='<h1>What do you want to understand?</h1><p>Ask a question and I will generate a narrated video lecture for it \u2014 then keep asking follow-ups.</p>';
  }else if(SERVICE.ready){
    w.innerHTML='<h1>What do you want to understand?</h1><p>Asking your own questions needs an LLM API key (LLM_API_KEY in .env). Meanwhile, pick a sample lecture and I will generate the full narrated video.</p>';
  }else{
    w.innerHTML='<h1>What do you want to understand?</h1><p>The generation service is not running. Start it with <code>phiversity-serve</code> and reload this page.</p>';
  }
  w.appendChild(chipRow(serviceChips()));col.appendChild(w);
}
function send(raw,topic){
  var text=(raw||'').trim(),img=attached;
  if(!text&&!img&&!topic)return;
  clearWelcome();addUser(text,img);
  attached=null;renderAttached();input.value='';grow();
  if(SERVICE.ready)serviceReply(text,topic,img);
  else{var el=document.createElement('div');el.className='msg bot';
    el.innerHTML='<div class="av" aria-hidden="true"></div><div class="body"><p>The generation service is not running. Start it with <code>phiversity-serve</code> and reload.</p></div>';
    col.appendChild(el)}
  scrollEnd();input.focus();
}

/* ---------- composer ---------- */
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px'}
function renderAttached(){
  attBox.innerHTML='';
  if(!attached){attBox.hidden=true;return}
  attBox.hidden=false;
  var d=document.createElement('div');d.className='att';
  var s=document.createElement('span');s.textContent=attached.name;
  var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Remove image');b.textContent='✕';
  b.onclick=function(){attached=null;fileIn.value='';renderAttached()};
  d.appendChild(s);d.appendChild(b);attBox.appendChild(d);
}
attachBtn.onclick=function(){fileIn.click()};
fileIn.onchange=function(){
  var f=fileIn.files[0];if(!f)return;
  if(!/^image\//.test(f.type)||f.size>5*1024*1024){fileIn.value='';return}
  attached={name:f.name,url:URL.createObjectURL(f)};renderAttached();
};
input.addEventListener('input',grow);
input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(input.value)}});
form.addEventListener('submit',function(e){e.preventDefault();send(input.value)});
newBtn.onclick=function(){closePanel();attached=null;renderAttached();TRANSCRIPT=[];CHAT_ID=null;CHAT_TITLE='';history.replaceState(null,'','chat.html');col.innerHTML='';showWelcome();thread.scrollTop=0;input.focus()};

/* ---------- boot: connect to the generation service ---------- */
(function boot(){
  fetch('/api/config').then(function(r){return r.json()}).then(function(c){
    SERVICE.ready=true;SERVICE.llm=!!c.llm_configured;SERVICE.topics=c.topics||[];
  }).catch(function(){}).then(function(){
    if(SERVICE.ready){
      var openLatest=function(){
        lf.get('/api/chats').then(function(d){
          if(!(d.chats||[]).length){showWelcome();return}
          var top=d.chats[0];
          return lf.get('/api/chats/'+top.id).then(function(c){
            restoreThread(c.messages,c.id,c.title);scrollEnd();
          });
        }).catch(function(){showWelcome()});
      };
      if(CHAT_ID){
        lf.get('/api/chats/'+CHAT_ID).then(function(c){
          restoreThread(c.messages,c.id,c.title);scrollEnd();
        }).catch(openLatest);
      }else openLatest();
      return;
    }
    showWelcome();
  });
})();
})();
</script>

</body></html>
